name: Atualizar preco, MVRV e Fear & Greed

on:
  schedule:
    # A cada 2 horas. As fontes publicam o dado diario uma vez por dia, mas em
    # horarios diferentes; rodar seguido encurta o atraso.
    - cron: '10 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar script de atualizacao
        run: python scripts/update_market.py

      - name: Commitar e publicar se houver mudancas
        run: |
          git config user.name  "letabuild-bot"
          git config user.email "bot@letabuild.com"
          git add btc/data/market.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos dados. Nada a commitar."
          else
            DAY=$(date '+%Y-%m-%d %H:%M')
            git commit -m "BTC: atualizacao automatica de preco, MVRV e Fear & Greed (${DAY} UTC)"
            git pull --rebase
            git push
          fi
